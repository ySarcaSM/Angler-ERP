name: Refresh npm lockfile (temporary)
on:
  push:
    branches: [security/phase-1-hardening-20261019]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'ySarcaSM/Angler-ERP'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: security/phase-1-hardening-20261019
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Regenerate a reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile on the feature branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: synchronize package-lock.json for reproducible builds'
            git push origin HEAD:security/phase-1-hardening-20261019
          fi
