name: Validate Angler ERP
on:
  pull_request:
    branches: [main]
  push:
    branches: [security/phase-1-hardening-20261019]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check src/services/firebase/admin.js && node --check src/services/firebase/sales.js && node --check src/services/firebase/purchases.js && node --check src/services/firebase/budgetApproval.js && node --check src/services/firebase/stock.js
      - run: npm run build
